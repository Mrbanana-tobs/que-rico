
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración | Qué Rico</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <h1 class="logo">Qué Rico<span>.</span></h1>
            <a href="index.html" class="nav-button">Volver a la tienda</a>
        </nav>
    </header>

    <main class="admin-container">

        <div class="section-title">
            <p>PANEL DE ADMINISTRACIÓN</p>
            <h2>Administrar productos</h2>
            <span>Agregá, editá y eliminá productos de tu catálogo.</span>
        </div>

        <section class="admin-form">
            <h2 id="form-title">Agregar nuevo producto</h2>

            <form id="product-form">

                <label for="nombre">Nombre del producto</label>
                <input type="text" id="nombre" placeholder="Ej: Torta de chocolate" required>

                <label for="precio">Precio</label>
                <input type="number" id="precio" placeholder="Ej: 25000" min="0" required>

                <label for="categoria">Categoría</label>
                <select id="categoria" required>
                    <option value="">Seleccionar categoría</option>
                    <option value="Tortas">Tortas</option>
                    <option value="Tartas">Tartas</option>
                    <option value="Pastelería">Pastelería</option>
                    <option value="Desayunos">Desayunos</option>
                    <option value="Otros">Otros</option>
                </select>

                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" placeholder="Descripción del producto"></textarea>

                <label for="imagen">Fotografía del producto</label>
                <input type="file" id="imagen" accept="image/*">

                <button type="submit" class="main-button" id="save-button">
                    Agregar producto
                </button>

                <button type="button" id="cancel-button" hidden>
                    Cancelar edición
                </button>

            </form>
        </section>

        <section class="admin-products">
            <h2>Mis productos</h2>

            <div id="admin-product-list">
                <!-- Los productos aparecerán aquí -->
            </div>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js?v=2"></script>
    <script src="admin.js"></script>

</body>
</html>
